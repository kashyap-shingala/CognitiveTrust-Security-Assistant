rules:
  - id: hardcoded-secret
    # This pattern finds any variable being assigned a string value.
    pattern-either:
      - pattern: $VAR = "..."
      - pattern: $VAR = '...'
    # THIS IS THE FIX:
    # We now correctly check the metavariable '$VAR' (the variable's name)
    # to see if it contains keywords like 'key', 'token', or 'secret'.
    metavariable-regex:
      metavariable: $VAR
      regex: (?i)(key|token|secret|passwd|password|credentials)
    message: "Hardcoded Secret Detected: The variable name '$VAR' suggests this is a secret."
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"

